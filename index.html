<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffe Recipe</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="row m-4 text-center">
        <h1 class="text-primary display-4 fw-normal">Coffee Brew Recipes</h1>
        <p class="fs-5 text-muted">
          Add custom recipes for your home brews below.
        </p>
      </div>
    </div>

    <main>
      <div class="container">
        <form
          id="recipe-form"
          class="p-4 m-4 row shadow-sm rounded-3 border border-primary"
        >
          <div class="form-group col-md-4 my-2">
            <label for="name">Name of Recipe</label>
            <input
              type="text"
              required
              id="name"
              autocomplete="off"
              class="form-control"
              placeholder="e.g., Morning Brew"
            />
          </div>
          <div class="form-group col-md-4 my-2">
            <label for="method">Brew Method</label>
            <input
              type="text"
              required
              id="method"
              autocomplete="off"
              class="form-control"
              placeholder="e.g., v60 Pour Over"
            />
          </div>
          <div class="form-group col-md-4 my-2">
            <label for="roast">Roast</label>
            <input
              type="text"
              required
              id="roast"
              autocomplete="off"
              class="form-control"
              placeholder="e.g., Full City"
            />
          </div>
          <div class="form-group col-md-4 my-2">
            <label for="grind">Grind Size</label>
            <input
              type="text"
              required
              id="grind"
              autocomplete="off"
              class="form-control"
              placeholder="e.g., 30"
            />
          </div>
          <div class="form-group col-md-4 my-2">
            <label for="ratio">Ratio</label>
            <input
              type="text"
              required
              id="ratio"
              autocomplete="off"
              class="form-control"
              placeholder="e.g., 1:16"
            />
          </div>
          <div class="form-group col-md-4 my-2">
            <label for="note">Note (optional)</label>
            <input
              type="text"
              id="note"
              autocomplete="off"
              class="form-control"
            />
          </div>
        </form>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
